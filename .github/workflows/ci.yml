# Tests and builds every pull request (Dependabot's included) and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show the Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: swift test --package-path LayoverKit

      # The configuration that ships, as the release workflow builds it, signed ad-hoc.
      - name: Build
        run: |
          xcodegen generate
          xcodebuild -project Layover.xcodeproj -scheme Layover -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath .build/xcode build
