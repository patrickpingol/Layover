name: Layover
options: { bundleIdPrefix: dev.mauipingol, deploymentTarget: { macOS: "14.0" } }
packages:
  LayoverKit: { path: LayoverKit }
targets:
  Layover:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes: [Info.plist, Layover.entitlements]
    dependencies: [{ package: LayoverKit, product: LayoverCore }, { package: LayoverKit, product: LayoverUI }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mauipingol.Layover
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Resources/Layover.entitlements
        INFOPLIST_FILE: App/Resources/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # Xcode drops the runtime flag for ad-hoc identities; codesign still honors it.
        OTHER_CODE_SIGN_FLAGS: "-o runtime"
        # With library validation (runtime flag) an ad-hoc signed debug dylib is rejected at launch.
        ENABLE_DEBUG_DYLIB: NO
